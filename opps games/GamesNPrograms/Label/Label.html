<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoplay Video Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-container {
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
            max-height: 70vh;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #2563eb;
        }

        .hint {
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 
          autoplay & muted: Required by browsers to play automatically when opened.
          playsinline: Ensures proper mobile playback support.
          controls: Adds standard play/pause/scrub timeline controls.
        -->
        <video id="myVideo" src="Advertisement.mp4" autoplay muted playsinline controls></video>
        
        <div class="controls-bar">
            <span class="hint" id="audioHint">Video is muted for autoplay compliance</span>
            <button id="fullscreenBtn">Go Fullscreen</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const audioHint = document.getElementById('audioHint');

        // Unmute automatically on first user click anywhere if desired, or let users use native controls
        video.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                audioHint.textContent = 'Audio enabled';
            }
        });

        // Fullscreen toggle logic
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) { /* Safari */
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) { /* IE11 */
                    video.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>

</body>
</html>
